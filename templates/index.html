<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Control System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Times New Roman", serif;
            background: white;
            color: #0B1F3A;
        }

        header {
            background: #0B1F3A;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 18px;
        }

        .hero {
            text-align: center;
            padding: 100px 20px;
        }

        .hero h2 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 22px;
            margin-bottom: 35px;
        }

        .button {
            display: inline-block;
            background: #0B1F3A;
            color: white;
            padding: 14px 30px;
            margin: 8px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 18px;
        }

        .button:hover {
            background: black;
        }
    </style>
</head>

<body>

<header>
    <h1>Expense Control System</h1>

</header>

<section class="hero">

    <h2>WELCOME</h2>

    <p>Manage Your Daily Expenses Efficiently</p>

    <a href="{{ url_for('login') }}" class="button">Login</a>

    <a href="{{ url_for('register') }}" class="button">Register</a>

</section>

</body>
</html>
